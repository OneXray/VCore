[project]
name = "vole-scripts"
version = "0.1.0"
description = "Vole native builds and release packaging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vole-scripts = "vole_scripts.cli:main"

[dependency-groups]
dev = ["ruff>=0,<1"]

[build-system]
requires = ["uv-build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
