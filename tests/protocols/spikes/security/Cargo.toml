[package]
name = "vcore-n0-security-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
missing-session-hook = []

[dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12", "reality"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["io-util"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "aes", "x25519"] }
rand = "0.10"

[patch.crates-io]
rustls = { git = "https://github.com/OneXray/rustls", rev = "bb4092cc32a101869406d0b8242b173372a9d3ea" }
