[package]
name = "vcore-n0-hysteria2-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

# N0-only experiment; no change to VCore's production features or dependency graph.
[workspace]

[dependencies]
bytes = "1"
futures-util = "0.3"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
http = "1"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
vcore = { path = "../../../..", default-features = false, features = ["outbound-socks5"] }

[patch.crates-io]
rustls = { git = "https://github.com/OneVCore/rustls", rev = "df261c84cbac4f708e63ac8644ce70daa90d771c" }
