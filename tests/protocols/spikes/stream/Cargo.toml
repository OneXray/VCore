[package]
name = "vcore-n0-stream-spike"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Independent N0-B experiment, not a production feature or dependency update.
[workspace]

[dependencies]
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
h2 = "=0.4.19"
http = "1"
# Tungstenite's trace logs can contain headers and payloads. Keep them compiled
# out even though this experiment does not enable the SS production feature.
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "sync", "test-util"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
vcore = { path = "../../../..", default-features = false, features = ["outbound-socks5"] }

[dev-dependencies]
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "ring"] }

[patch.crates-io]
rustls = { git = "https://github.com/OneXray/rustls", rev = "df261c84cbac4f708e63ac8644ce70daa90d771c" }
