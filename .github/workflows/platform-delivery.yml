name: Release builds and artifact identity

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  production:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apple
            label: Apple
            platform: apple
            runner: macos-26
            targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-tvos,aarch64-apple-tvos-sim
          - name: android
            label: Android
            platform: android
            runner: ubuntu-24.04
            targets: aarch64-linux-android,x86_64-linux-android
          - name: windows-x64
            label: Windows x64
            platform: windows
            runner: windows-2025
            targets: x86_64-pc-windows-msvc
          - name: windows-arm64
            label: Windows ARM64
            platform: windows
            runner: windows-11-arm
            targets: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
          components: rustfmt
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12"
      - name: Install latest stable Python 3
        shell: bash
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/python
        run: |
          uv python install 3 --no-bin --no-registry
          echo "UV_PYTHON=$(uv python find --managed-python --no-project 3)" >> "$GITHUB_ENV"
      - name: Build artifact helper contracts
        run: uv run --project scripts --locked python -m unittest discover -s scripts/tests -p test_platform_delivery.py
      - name: Locked source
        run: cargo fetch --locked
      - name: Android toolchain
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ndk_package="$("$sdkmanager" --list --channel=0 | awk -F '|' '
            NF == 1 { split($0, fields, " "); $1 = fields[1]; $2 = fields[2] }
            { gsub(/[[:space:]]/, "", $1); gsub(/[[:space:]]/, "", $2) }
            $1 ~ /^ndk[;\/]30\.[0-9]+\.[0-9]+$/ &&
              $2 ~ /^30\.[0-9]+\.[0-9]+$/ {
                sub(/^ndk\//, "ndk;", $1); print $1
              }
          ' | sort -Vu | tail -n 1)"
          test -n "$ndk_package" || { echo "Stable NDK r30 is unavailable" >&2; exit 1; }
          "$sdkmanager" --channel=0 "$ndk_package"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ndk_package#ndk;}" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: delivery-${{ matrix.name }}-${{ hashFiles('scripts/src/vole_scripts/builds.py', 'scripts/cmake/**') }}
          workspaces: ". -> target"
          env-vars: ImageOS ImageVersion SDKROOT DEVELOPER_DIR ANDROID_NDK_HOME VOLE BORING AWS_LC LIBCLANG BINDGEN
          cache-bin: "false"
      - name: Build production artifacts and validate identity
        run: uv run --project scripts --locked vole-scripts build ${{ matrix.platform }} --delivery
      - name: Check native Wintun CLI without staging release assets
        if: matrix.platform == 'windows'
        run: >-
          uv run --project scripts --locked python -c
          "from vole_scripts.builds import check_windows_wintun_cli; check_windows_wintun_cli()"
      - name: Preserve unsigned build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vole-${{ matrix.name }}-${{ github.sha }}
          path: |
            dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
