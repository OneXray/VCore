name: CLI tag release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            platform: linux
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            platform: windows
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            platform: windows
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            platform: darwin
          - target: aarch64-apple-darwin
            runner: macos-26
            platform: darwin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12"
      - name: Install latest stable Python 3
        shell: bash
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/python
        run: |
          uv python install 3 --no-bin --no-registry
          echo "UV_PYTHON=$(uv python find --managed-python --no-project 3)" >> "$GITHUB_ENV"
      - name: Validate release tag and checked-out source before compilation
        shell: bash
        env:
          VOLE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --project scripts --locked python - <<'PY'
          import os
          from vole_scripts import builds, cli_release
          cli_release._source(builds.CORE_DIR, os.environ["VOLE_RELEASE_TAG"])
          PY
      - name: CLI release helper regressions
        run: uv run --project scripts --locked python -m unittest discover -s scripts/tests -p test_cli_release.py
      - name: Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build perl pkg-config
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-release-${{ matrix.target }}-${{ hashFiles('scripts/src/vole_scripts/cli_release.py', 'scripts/cmake/**', 'build.rs') }}
          workspaces: ". -> target"
          env-vars: ImageOS ImageVersion SDKROOT DEVELOPER_DIR BORING AWS_LC LIBCLANG BINDGEN
          cache-bin: "false"
      - name: Build locked production CLI, inspect binary and run offline flags
        env:
          VOLE_RELEASE_TAG: ${{ github.ref_name }}
          VOLE_RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          uv run --project scripts --locked python -m vole_scripts.cli_release build
          --target ${{ matrix.target }}
          --tag "$VOLE_RELEASE_TAG"
          --repository "$VOLE_RELEASE_REPOSITORY"
        shell: bash
      - name: Preserve archive and internal build evidence
        uses: actions/upload-artifact@v7
        with:
          name: vole-cli-${{ matrix.target }}-${{ github.sha }}
          path: dist/cli/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish all six CLI archives
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12"
      - name: Install latest stable Python 3
        shell: bash
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/python
        run: |
          uv python install 3 --no-bin --no-registry
          echo "UV_PYTHON=$(uv python find --managed-python --no-project 3)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: vole-cli-*-${{ github.sha }}
          path: dist/cli-incoming
      - name: Verify complete source, archive, binary and embedded notice identities
        shell: bash
        env:
          VOLE_RELEASE_TAG: ${{ github.ref_name }}
          VOLE_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          uv run --project scripts --locked python -m vole_scripts.cli_release assemble \
            --tag "$VOLE_RELEASE_TAG" --repository "$VOLE_RELEASE_REPOSITORY" \
            --input dist/cli-incoming --notes "$RUNNER_TEMP/vole-release.md"
      - name: Create release with six binary archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VOLE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          archives=(dist/cli-incoming/*/vole-*.gz dist/cli-incoming/*/vole-*.zip)
          test "${#archives[@]}" -eq 6
          gh release create "$VOLE_RELEASE_TAG" "${archives[@]}" \
            --verify-tag --title "Vole $VOLE_RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/vole-release.md"
