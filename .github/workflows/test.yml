name: Tests

on:
  pull_request:
  push:
    branches: [main, feat/platform-delivery-n10]

permissions:
  contents: read

jobs:
  client-contracts:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.13"
      - name: Formatting, scripts, and dependency contract
        run: |
          cargo fmt --all -- --check
          uv run --project scripts --locked python -m unittest discover -s scripts/tests
          uv run --project scripts --locked ruff check scripts
          uv run --project scripts --locked ruff format --check scripts
          uv run --project scripts --locked vcore-scripts check c-header
          uv run --project scripts --locked vcore-scripts check tls-dependencies
      - name: Frozen memory-only Debug, Release, and feature contracts
        run: |
          uv run --project scripts --locked python - <<'PY'
          import subprocess
          from vcore_scripts.protocol_n9_local import commands
          for gate in ("N9-DEBUG", "N9-RELEASE", "N9-FEATURES"):
              selected = commands(gate)
              if not selected:
                  raise RuntimeError(f"empty required gate: {gate}")
              for command in selected:
                  print(gate, command, flush=True)
                  subprocess.run(command, check=True)
          PY
      - name: Memory-only netstack tests
        run: |
          cargo test --locked --manifest-path crates/vcore-netstack/Cargo.toml --all-targets
      - name: Production and netstack clippy
        run: |
          cargo clippy --locked --all-features --lib --bins -- -D warnings
          cargo clippy --locked --features ffi --test mihomo_interop -- -D warnings
          cargo clippy --locked --manifest-path crates/vcore-netstack/Cargo.toml --all-targets -- -D warnings

  platform-build:
    uses: ./.github/workflows/platform-delivery.yml
