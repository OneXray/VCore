name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build default features
        run: cargo build --locked --all-targets
      - name: Debug tests
        run: cargo test --locked --all-features --all-targets
      - name: Release tests
        run: cargo test --locked --release --all-features --all-targets

  client-contracts:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.13"
      - name: Formatting, scripts, and dependency contract
        run: |
          cargo fmt --all -- --check
          uv run --project scripts --locked python -m unittest discover -s scripts/tests
          uv run --project scripts --locked ruff check scripts
          uv run --project scripts --locked ruff format --check scripts
          uv run --project scripts --locked vcore-scripts check c-header
          uv run --project scripts --locked vcore-scripts check tls-dependencies
      - name: Minimal and individual protocol features
        run: |
          cargo check --locked --no-default-features --lib
          for features in inbound-http inbound-socks5 outbound-anytls outbound-socks5 outbound-shadowsocks outbound-vless inbound-http,inbound-socks5 ffi; do
            cargo check --locked --no-default-features --features "$features" --lib
          done
      - name: Debug and Release runtime tests
        run: |
          cargo test --locked --all-features --all-targets
          cargo test --locked --release --all-features --all-targets
          cargo test --locked --manifest-path crates/vcore-netstack/Cargo.toml --all-targets
      - name: Production and netstack clippy
        run: |
          cargo clippy --locked --all-features --lib --bins -- -D warnings
          cargo clippy --locked --features ffi --test mihomo_interop -- -D warnings
          cargo clippy --locked --manifest-path crates/vcore-netstack/Cargo.toml --all-targets -- -D warnings

  platform-build:
    name: Release ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apple
            platform: apple
            runner: macos-15
            targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
          - name: android
            platform: android
            runner: ubuntu-24.04
            targets: aarch64-linux-android,x86_64-linux-android
          - name: windows-x64
            platform: windows
            runner: windows-2025
            targets: x86_64-pc-windows-msvc
          - name: windows-arm64
            platform: windows
            runner: windows-11-arm
            targets: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
          components: rustfmt
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.13"
      - name: Record locked source and toolchain
        run: |
          git rev-parse HEAD
          rustc --version --verbose
          cargo fetch --locked
      - name: Apple SDK versions
        if: matrix.platform == 'apple'
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Build Android with the pinned NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager "ndk;28.2.13676358"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          uv run --project scripts --locked vcore-scripts build android
      - name: Build native platform artifacts
        if: matrix.platform != 'android'
        run: uv run --project scripts --locked vcore-scripts build ${{ matrix.platform }}
      - name: Record Unix artifact hashes
        if: runner.os != 'Windows'
        shell: bash
        run: |
          shasum -a 256 Cargo.lock
          find dist -type f -exec shasum -a 256 {} +
      - name: Record Windows artifact hashes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-FileHash Cargo.lock -Algorithm SHA256
          Get-ChildItem dist -Recurse -File | Get-FileHash -Algorithm SHA256
      - name: Preserve unsigned build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vcore-${{ matrix.name }}-${{ github.sha }}
          path: |
            dist/${{ matrix.platform }}/
            Cargo.lock
          if-no-files-found: error
          retention-days: 7
