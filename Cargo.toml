[workspace]
members = ["crates/vcore-netstack"]
resolver = "3"

[package]
name = "vcore"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "vcore"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "vcore-windows-vpn-host"
path = "src/bin/windows_vpn_host.rs"
required-features = ["ffi"]

[[bin]]
name = "vcore-windows-session-host"
path = "src/bin/windows_session_host.rs"
required-features = ["ffi"]

[[example]]
name = "protocol-stream-probe"
path = "tests/protocols/stream_probe.rs"
required-features = ["interop-test", "stream-transport"]

[features]
default = [
    "inbound-http",
    "inbound-socks5",
    "outbound-anytls",
    "outbound-socks5",
    "outbound-shadowsocks",
    "outbound-vless",
]
inbound-http = []
inbound-socks5 = []
outbound-anytls = ["dep:md-5"]
outbound-socks5 = []
outbound-shadowsocks = ["dep:shadowsocks", "dep:log"]
outbound-vless = ["rustls/reality", "stream-transport"]
# N1 foundation features. YAML registration waits for each protocol stage.
outbound-trojan = ["stream-transport"]
outbound-vmess = ["stream-transport"]
outbound-hysteria2 = []
outbound-wireguard = []
stream-transport = ["dep:tokio-tungstenite", "dep:httparse", "dep:log"]
# Enables local interoperability-only trust-root injection. Release build
# scripts must not enable this feature.
interop-test = ["outbound-anytls", "outbound-vless"]
ffi = ["tun", "dep:windows", "dep:windows-collections", "dep:windows-core"]
tun = [
    "dep:rust-tun",
    "dep:vcore-netstack",
    "inbound-http",
    "inbound-socks5",
    "outbound-anytls",
    "outbound-socks5",
    "outbound-shadowsocks",
    "outbound-vless",
]

[dependencies]
arc-swap = "1"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
h2 = "0.4.19"
http = "1"
httparse = { version = "1.10", optional = true }
idna = "1.1"
libc = "0.2"
# Upstream SS trace/debug logs include key material and traffic destinations.
# Keep the log facade compiled out when SS is linked; VCore uses tracing.
log = { version = "0.4", optional = true, features = ["max_level_off", "release_max_level_off"] }
md-5 = { version = "0.11", optional = true }
rand = "0.10"
regex-automata = { version = "0.4", default-features = false, features = ["dfa-build", "dfa-search", "syntax", "unicode"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
shadowsocks = { git = "https://github.com/shadowsocks/shadowsocks-rust.git", rev = "ab388c7466d21f979430e33cc9ef10e22fb05955", optional = true, default-features = false, features = ["aead-cipher-2022"] }
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"], optional = true }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde"] }
vcore-netstack = { path = "crates/vcore-netstack", optional = true }
webpki-roots = "1"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
oslog = { version = "0.2", default-features = false }

[target.'cfg(unix)'.dependencies]
rust-tun = { package = "tun", version = "=0.8.14", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, features = [
    "ApplicationModel_Background",
    "ApplicationModel_Core",
    "Foundation",
    "Foundation_Collections",
    "Networking",
    "Networking_Connectivity",
    "Networking_Sockets",
    "Networking_Vpn",
    "Storage",
    "Storage_Search",
    "Storage_Streams",
    "UI_Core",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_System_JobObjects",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }
# Keep the companion types required by the latest windows SDK. The separately
# released 0.100.x crates are not type-compatible with windows 0.62.2.
windows-collections = { version = "=0.3.2", optional = true }
windows-core = { version = "=0.62.2", optional = true }

[dev-dependencies]
# Independent EIH relay fixture only; production crypto remains the official SS crate.
aes = "0.9"
blake3 = "1"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
tempfile = "3"

[patch.crates-io]
rustls = { git = "https://github.com/OneXray/rustls", branch = "vcore/reality-0.23" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "unwind"
strip = "symbols"

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "allow"
