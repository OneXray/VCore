# VCore 配置修订版 12 的完整示例。
#
# `version.configVersion` 返回的 12 是二进制报告值，不是 YAML 字段。配置只接受
# 本文列出的结构；未知字段、anchor、alias 和自定义 tag 都会失败。
#
# 宿主先通过 Invoke API v5 调用 initialize({dataDir})，再通过 configYaml 内联
# 传入配置。GeoData 固定由 VCore 管理在 dataDir/geodata 中。

# IPv6 数据面总开关，省略时默认为 true。false 时拒绝 IPv6 字面量业务目标、过滤
# 本地解析和代理根节点的 IPv6 地址、禁止 IPv6 物理 socket，并在 TUN 入口丢弃
# IPv6 包。dns.ipv6 只有与本项同时为 true 时才生效。
ipv6: true

# GeoData 下载配置可省略；出现时三项必须齐全。URL 必须是以域名为主机、无
# userinfo/fragment 的绝对 HTTPS URL，更新周期固定为 24 小时。validateConfig 和
# measureDelay 不下载。公共实例启动后，只有实际规则需要资产且自动更新已启用时
# 才后台检查。下载使用最终 MATCH 选中的完整代理链，不回退 DIRECT。
geox-url:
  geoip: https://assets.example.com/geoip.dat
  geosite: https://assets.example.com/geosite.dat
geo-auto-update: true
geo-update-interval: 24

# 可选的回环 HTTP CONNECT/forward 监听器。port 与 authentication 必须同时
# 出现，authentication 必须恰好包含一个 user:password。该监听器可供宿主执行
# 连通性探测，不提供 SOCKS5 入站或 UDP。
port: 1080
authentication:
  - "probe-user:probe-password"

# 可选的 TUN 流量 Controller。只允许配合 tun.enable: true 使用，地址必须是
# 回环地址。secret 省略时不鉴权，出现时必须非空。只支持 `GET /traffic` 返回
# 一次 up/down/upTotal/downTotal 快照；它不属于 Invoke API。
external-controller: 127.0.0.1:9090
secret: "vcore-runtime-secret"

# TUN 文件描述符、帧格式和 Android protect 由 Invoke 提供，不进入 YAML。
# 配置必须包含 port 或启用 TUN；MTU 默认为 1500，当前只接受该值。
tun:
  enable: true
  mtu: 1500

# 可选的 TUN TCP/UDP 嗅探器。省略或 enable: false 表示关闭。启用时至少配置
# HTTP、TLS、QUIC 之一；协议值为空或省略 ports 时分别使用 80/443/443。每种协议
# 最多 64 个单端口或升序闭区间；HTTP 与 TLS 的 TCP 端口不能重叠，QUIC 使用
# UDP，可与二者使用相同端口。嗅探结果只参与选路，不改写实际目标。
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8380]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# 至少配置一个平铺代理。name 大小写敏感且必须唯一；dialer-proxy 必须引用另一个
# 实际 name。未知引用、自引用和环都会失败。代理数量和链深没有独立上限，仍受
# YAML 256 KiB、名称唯一和全图无环约束。物理首跳需要连接本机服务时，server 必须
# 显式使用 127.0.0.0/8 范围内的 IPv4 字面量或 ::1；域名解析到回环地址会失败关闭。
#
# VLESS 子集：
# - type 固定 vless，network 固定 xhttp，tls 必须为 true；
# - encryption 省略或 none，flow 省略或空字符串；
# - servername 可省略（缺省为 server），alpn 省略或严格 [h2]；
# - TLS 省略 reality-opts；REALITY 必须提供 reality-opts.public-key，可选 short-id；
# - xhttp-opts 可包含 host/path/mode/download-settings，mode 只接受
#   auto/packet-up/stream-up/stream-one；stream-one 不能与 download-settings 同用；
# - download-settings 一旦出现（包括 {}），就为下行 GET 创建独立的
#   server -> TLS/REALITY -> HTTP/2 连接；上行 POST 仍走主连接，两者共用
#   XHTTP session ID，不进行第二次 VLESS 握手。两条请求最终必须由 CDN 或
#   反向代理汇聚到同一个服务端 XHTTP 处理器和会话存储。只支持
#   server/port/tls/servername/alpn/reality-opts/host/path；
# - download-settings 中缺省的字段继承主连接。reality-opts 缺省时继承
#   主连接的 TLS/REALITY，即外层 REALITY 下单独写 tls: true 也不会清除
#   REALITY；reality-opts 存在时选择/覆盖 REALITY，tls: false 始终失败。
#   当前结构没有“清除已继承 REALITY”的标记，因此无法表达“主连接 REALITY、
#   下行连接标准 TLS”；解析器不会猜测该语义。
#   auto 为 TLS -> packet-up、REALITY +
#   download-settings -> stream-up、REALITY 无 download-settings -> stream-one；
# - 不接受 packet-encoding、headers/reuse-settings、fingerprint、client-fingerprint、
#   skip-cert-verify、ECH、mTLS、shadow-tls-opts、restls-opts 或 jls-opts。
#
# 下方 vless-edge 通过 socks-hop 建链：
# 客户端 -> socks-hop -> vless-edge -> 目标。
proxies:
  - name: vless-edge
    type: vless
    server: edge.example.com
    port: 443
    uuid: 00000000-0000-4000-8000-000000000001
    udp: true
    network: xhttp
    tls: true
    servername: edge.example.com
    encryption: none
    alpn: [h2]
    xhttp-opts:
      host: edge.example.com
      path: /onev
      mode: auto
      # 完整覆盖示例；改成 download-settings: {} 则所有字段继承主连接。
      download-settings:
        server: download.edge.example.com
        port: 443
        tls: true
        servername: download.edge.example.com
        alpn: [h2]
        host: download.edge.example.com
        path: /onev-download
    dialer-proxy: socks-hop

  # REALITY 写法示意：在 VLESS 节点中保留 tls: true，并增加以下 mapping；不要与
  # 任何证书跳过或 fingerprint 字段组合。示例值是合法格式，不代表真实节点。
  # reality-opts:
  #   public-key: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
  #   short-id: "0123"

  # SOCKS5 出站支持 CONNECT 和 UDP ASSOCIATE。username/password 必须同时省略
  # 或同时出现；tls 只能省略或为 false。udp 控制 UDP ASSOCIATE。
  - name: socks-hop
    type: socks5
    server: socks.example.com
    port: 1080
    username: user
    password: password
    udp: true

  # AnyTLS 只提供客户端出站，配置只接受以下字段和可选 dialer-proxy。
  # sni 省略时使用 server。固定使用 WebPKI 校验的标准 TLS 1.3/1.2，不发送 ALPN，
  # 不支持 REALITY、fp、跳过证书验证、ECH、mTLS 或 session/padding 调参字段。
  # TCP 使用 AnyTLS session；udp: true 使用 UoT v2 datagram mode。
  - name: anytls-edge
    type: anytls
    server: anytls.example.com
    port: 443
    password: "private-anytls-password"
    sni: anytls.example.com
    udp: true

# 运行时 DNS 可省略；enable: true 时主 nameserver 必须有 1–4 项。ipv6 省略时
# 默认为 true；false 时直接 AAAA 查询返回空结果，域名解析不查询 AAAA。nameserver
# 只接受裸 IP、udp://IP[:port] 或 tcp://IP[:port]。没有 fragment 时固定 DIRECT；
# fragment 只接受 DIRECT、RULES 或实际代理名。`PROXY`/`#PROXY` 没有默认出口
# 含义，只有存在同名代理时才有效。nameserver-policy 按顺序匹配
# `geosite:<code>[,<code>...]`，命中后只在当前组内顺序故障转移。
dns:
  enable: true
  ipv6: true
  nameserver:
    - "tcp://1.1.1.1:53#vless-edge"
  nameserver-policy:
    "geosite:private,cn,apple":
      - "tcp://223.5.5.5:53#DIRECT"
      - "tcp://1.1.1.1:53#vless-edge"

# rules 是运行配置必填项，按顺序首条命中。DIRECT 与 REJECT 是内置动作，其他
# 动作必须精确使用实际代理名。`PROXY` 没有特殊别名。rules 不能为空，必须恰好
# 以一个指向实际代理的 MATCH 结束；不存在隐式 MATCH 或 DIRECT 回退。
rules:
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - DOMAIN-SUFFIX,anytls.example,anytls-edge
  - NETWORK,UDP,anytls-edge
  - MATCH,vless-edge

# measureDelay 使用独立的节点配置：顶层只能包含 proxies。节点字段和代理图校验
# 与上文一致，但不能出现 port/authentication、tun、sniffer、Controller、DNS、
# rules 或 GeoData。VCore 从“未被任何 dialer-proxy 引用”的节点推导唯一链头，
# 且该链必须覆盖全部节点。测速不创建监听器、公共实例、TUN/protect 租约、DNS、
# 规则引擎或 GeoData 注册。
#
# 最小测速示例：
# proxies:
#   - name: exit
#     type: anytls
#     server: anytls.example.com
#     port: 443
#     password: secret
