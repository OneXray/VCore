# VCore 配置修订版 14 的完整示例。
#
# `version.configVersion` 返回的 14 是二进制报告值，不是 YAML 字段。配置只接受
# 本文列出的结构；未知字段、anchor、alias 和自定义 tag 都会失败。
#
# 宿主先通过 Invoke API v5 调用 initialize({dataDir})，再通过 configYaml 内联
# 传入配置。GeoData 固定由 VCore 管理在 dataDir/geodata 中。

# IPv6 数据面总开关，省略时默认为 true。false 时拒绝 IPv6 字面量业务目标、过滤
# 本地解析和代理根节点的 IPv6 地址、禁止 IPv6 物理 socket，并在 TUN 入口丢弃
# IPv6 包。dns.ipv6 只有与本项同时为 true 时才生效。
ipv6: true

# GeoData 下载配置可省略；出现时三项必须齐全。URL 必须是以域名为主机、无
# userinfo/fragment 的绝对 HTTPS URL，更新周期固定为 24 小时。validateConfig 和
# measureDelay 不下载。公共实例启动后，只有实际规则需要资产且自动更新已启用时
# 才后台检查。下载使用最终 MATCH route target 在创建新物理 transport 时解析到的
# 当前节点、DIRECT 或 REJECT；代理组不自动故障转移，也不回退 DIRECT。
geox-url:
  geoip: https://assets.example.com/geoip.dat
  geosite: https://assets.example.com/geosite.dat
geo-auto-update: true
geo-update-interval: 24

# 可选的 HTTP CONNECT/forward 监听器；port 省略或 0 时关闭，1–65535 时启用。
# allow-lan 默认 false，绑定回环；true 时绑定通配地址且必须提供有效认证。
# ipv6: true 时同时绑定同端口 IPv6（v6-only）；false 时只监听 IPv4。
# authentication 省略或 [] 表示本机免认证；提供时必须恰好包含一项 user:password，
# 按首个冒号分隔，用户名 / 密码各 1–255 UTF-8 字节，HTTP/SOCKS5 共用。
# 共享或非空认证要求 port 或 socks-port 启用。
# HTTP 逐请求认证、选路，支持流式正文 / 分块、Keep-Alive、CONNECT 与 Upgrade。
# 共享只适合可信网络，Basic 不加密链路；详细边界见 docs/http-proxy.md。
port: 1080
# SOCKS5 CONNECT / UDP ASSOCIATE；省略或 0 关闭，非零时 TCP/UDP 同端口。
# UDP 必须属于有效的 TCP 控制连接，源 IP/端口校验和资源上限见 socks5-proxy.md。
socks-port: 1081
allow-lan: false
authentication:
  - "probe-user:probe-password"

# 可选的运行时 Controller，地址必须是回环 IP 和显式非零端口。它可服务于启用
# TUN 的配置或含 proxy-groups 的配置；运行配置仍需开启 HTTP/SOCKS5 或 TUN。
# 只要 Controller 管理 proxy-groups，secret 就必填；仅有 TUN 流量接口时可省略。
# secret 出现时必须为 1–255 UTF-8 字节，并作为全部 Controller 路由的 Bearer token。
# Controller 提供 GET /traffic、GET /group、GET /group/{name}、
# GET /proxies/{name} 和 PUT /proxies/{name}，不属于 Invoke API。
external-controller: 127.0.0.1:9090
secret: "vcore-runtime-secret"

# TUN 文件描述符、帧格式和 Android protect 由 Invoke 提供，不进入 YAML。
# 配置必须启用 port、socks-port 或 TUN；MTU 默认为 1500，当前只接受该值。
tun:
  enable: true
  mtu: 1500

# 可选的 TUN TCP/UDP 嗅探器。省略或 enable: false 表示关闭。启用时至少配置
# HTTP、TLS、QUIC 之一；协议值为空或省略 ports 时分别使用 80/443/443。每种协议
# 最多 64 个单端口或升序闭区间；HTTP 与 TLS 的 TCP 端口不能重叠，QUIC 使用
# UDP，可与二者使用相同端口。嗅探结果只参与选路，不改写实际目标。
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8380]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# 至少配置一个具体代理节点。节点和代理组定义名共享同一大小写敏感的命名空间，
# 引用精确匹配且不做 Unicode normalization 或大小写折叠。名称必须为 1–64 UTF-8
# 字节，首尾不能是任何 Unicode 空白字符，不能含控制字符，也不能包含逗号、井号、
# 斜杠、问号、`&`、`=`、`%`、反斜杠，或使用 `.`、`..`、`DIRECT`、`REJECT`、
# `RULES`；内部普通空格、CJK 和 emoji 可用。dialer-proxy 可引用具体节点或 select
# 组。所有节点上游和全部组成员（包括未选成员）组成同一张无环图；未知引用、自引用
# 和混合环均失败。代理数量和链深没有独立上限，仍受 YAML 256 KiB 和名称唯一约束。
# 节点没有上游，或上游组经纯组成员链能到达 DIRECT 时，prepare 预解析该节点及其
# 独立下载端点，即使 DIRECT 尚未选中；纯代理路径保留逻辑域名。候选首跳 DNS 失败
# 则 prepare 失败，切换 DIRECT 不临时调用系统 DNS。物理首跳连接本机服务时，server 必须使用 127.0.0.0/8
# 范围内的 IPv4 字面量或 ::1；域名解析到回环地址会失败关闭。
#
# VLESS 子集：
# - type 固定 vless，network 固定 xhttp，tls 必须为 true；
# - encryption 省略或 none，flow 省略或空字符串；
# - servername 可省略（缺省为 server），alpn 省略或严格 [h2]；
# - TLS 省略 reality-opts；REALITY 必须提供 reality-opts.public-key，可选 short-id；
# - xhttp-opts 可包含 host/path/mode/download-settings，mode 只接受
#   auto/packet-up/stream-up/stream-one；stream-one 不能与 download-settings 同用；
# - download-settings 一旦出现（包括 {}），就为下行 GET 创建独立的
#   server -> TLS/REALITY -> HTTP/2 连接；上行 POST 仍走主连接，两者共用
#   XHTTP session ID，不进行第二次 VLESS 握手。两条请求最终必须由 CDN 或
#   反向代理汇聚到同一个服务端 XHTTP 处理器和会话存储。只支持
#   server/port/tls/servername/alpn/reality-opts/host/path；
# - download-settings 中缺省的字段继承主连接。reality-opts 缺省时继承
#   主连接的 TLS/REALITY，即外层 REALITY 下单独写 tls: true 也不会清除
#   REALITY；reality-opts 存在时选择/覆盖 REALITY，tls: false 始终失败。
#   当前结构没有“清除已继承 REALITY”的标记，因此无法表达“主连接 REALITY、
#   下行连接标准 TLS”；解析器不会猜测该语义。
#   auto 为 TLS -> packet-up、REALITY +
#   download-settings -> stream-up、REALITY 无 download-settings -> stream-one；
# - 不接受 packet-encoding、headers/reuse-settings、fingerprint、client-fingerprint、
#   skip-cert-verify、ECH、mTLS、shadow-tls-opts、restls-opts 或 jls-opts。
#
# 下方 vless-edge 通过 upstream-select 当前选择的 socks-hop 建链：
# 客户端 -> socks-hop -> vless-edge -> 目标。
proxies:
  - name: vless-edge
    type: vless
    server: edge.example.com
    port: 443
    uuid: 00000000-0000-4000-8000-000000000001
    udp: true
    network: xhttp
    tls: true
    servername: edge.example.com
    encryption: none
    alpn: [h2]
    xhttp-opts:
      host: edge.example.com
      path: /onev
      mode: auto
      # 完整覆盖示例；改成 download-settings: {} 则所有字段继承主连接。
      download-settings:
        server: download.edge.example.com
        port: 443
        tls: true
        servername: download.edge.example.com
        alpn: [h2]
        host: download.edge.example.com
        path: /onev-download
    dialer-proxy: upstream-select

  # REALITY 写法示意：在 VLESS 节点中保留 tls: true，并增加以下 mapping；不要与
  # 任何证书跳过或 fingerprint 字段组合。示例值是合法格式，不代表真实节点。
  # reality-opts:
  #   public-key: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
  #   short-id: "0123"

  # SOCKS5 出站支持 CONNECT 和 UDP ASSOCIATE。username/password 必须同时省略
  # 或同时出现；tls 只能省略或为 false。udp 控制 UDP ASSOCIATE。
  - name: socks-hop
    type: socks5
    server: socks.example.com
    port: 1080
    username: user
    password: password
    udp: true

  # AnyTLS 只提供客户端出站，配置只接受以下字段和可选 dialer-proxy。
  # sni 省略时使用 server。TLS 1.3/1.2 默认 WebPKI，alpn 省略/[] 时不发送。
  # skip-cert-verify 不能覆盖 fingerprint；pin 是证书 SHA-256，不是客户端伪造指纹。
  # 叶 pin 直接决定信任；非叶 pin 作为根继续验证链和名称。所有策略均验证握手签名。
  # 不支持 REALITY、fp、ECH、mTLS 或 session/padding 调参字段，详见 anytls.md。
  # TCP 使用 AnyTLS session；udp: true 使用 UoT v2 datagram mode。
  - name: anytls-edge
    type: anytls
    server: anytls.example.com
    port: 443
    password: "private-anytls-password"
    sni: anytls.example.com
    # alpn: [h2, http/1.1]
    skip-cert-verify: false
    # fingerprint: "<certificate SHA-256, 64 hex digits>"
    udp: true

  # SS 2022：cipher 精确接受下列三种；AES-128 密钥解码后 16 字节，其余为 32。
  # 2022-blake3-aes-128-gcm / 2022-blake3-aes-256-gcm /
  # 2022-blake3-chacha20-poly1305。
  # AES password 可用 iPSK1:...:iPSKn:uPSK 身份链，其他算法仅单一 Base64 PSK。
  # 以下仅为公开测试 key，不可用于真实服务。UDP 默认 false。
  # 上游 padding 风险和验收边界见 shadowsocks.md；
  # 完整互通尚未签收。dialer-proxy 可引用具体节点或 select 组。
  - name: ss-edge
    type: ss
    server: ss.example.com
    port: 8388
    cipher: 2022-blake3-aes-128-gcm
    password: "BwcHBwcHBwcHBwcHBwcHBw=="
    udp: true

# 可选的静态 `select` 代理组。字段外形是严格 Mihomo 子集：每组只接受 name、
# type、proxies 和可选 default-selected，type 只能是 select，proxies 至少一项。
# 成员可精确引用具体节点、另一个 select 组、DIRECT 或 REJECT；RULES 不是成员。
# 组声明顺序、成员顺序和重复成员全部保留，节点与组的完整混合图必须无环；组数、成员数和嵌套
# 深度没有独立上限，仍受 256 KiB 配置总大小和 O(V+E) 无环校验约束。
#
# default-selected 省略时选中第一项；显式值必须是当前组的直接成员。重复名称按
# 第一项命中。没有 Controller 时，该初始选择在本次 session 内固定；有 Controller
# 时可实时切换。选择只存于 VCore 当前 session 内存，VCore 不写回 YAML；宿主若需
# 跨 session 保留，必须持久化选择并在下次配置中注入 default-selected。
#
# 切换只影响之后新建的物理 TCP 连接、UDP association/transport 和 DNS transport；
# 既有 TCP 连接、UDP association、DNS cache/singleflight、DNS TCP pool 和其中的
# transport 不迁移、不清空。选中成员失败时原样失败，代理组不自动换成员。
# 组作为 dialer-proxy 时，与路由共用当前选择，但不重新执行业务规则；DIRECT 连接
# 当前节点的服务器而不是业务目标，REJECT 在建链时失败且不回退。单次建链对每个组
# 只读一次选择，SOCKS5 UDP 控制流与 relay 路径共用该快照和期限；不同组没有原子
# 快照保证。复用旧 AnyTLS 会话的新业务流仍沿用该会话路径，只有新建底层 transport
# 才读取新选择。业务节点的 udp 开关不阻止上游通过 TCP 承载封装后的 UDP。
proxy-groups:
  - name: upstream-select
    type: select
    proxies: [socks-hop, DIRECT, REJECT]

  - name: fallback-select
    type: select
    proxies: [socks-hop, DIRECT]

  - name: main-select
    type: select
    proxies: [vless-edge, fallback-select, DIRECT, REJECT, vless-edge]
    default-selected: vless-edge

# 运行时 DNS 可省略；enable: true 时主 nameserver 必须有 1–4 项。ipv6 省略时
# 默认为 true；false 时直接 AAAA 查询返回空结果，域名解析不查询 AAAA。nameserver
# 只接受裸 IP、udp://IP[:port] 或 tcp://IP[:port]。没有 fragment 时固定 DIRECT；
# fragment 只接受 DIRECT、RULES、实际节点名或代理组名。`PROXY`/`#PROXY` 没有
# 默认出口含义，只有存在同名 route target 时才有效。DNS route 选中代理组后，
# 仅新建物理 transport 解析当前成员；cache 与既有 TCP pool 不随切换清空。
# nameserver-policy 按顺序匹配
# `geosite:<code>[,<code>...]`，命中后只在当前组内顺序故障转移。
dns:
  enable: true
  ipv6: true
  nameserver:
    - "tcp://1.1.1.1:53#main-select"
  nameserver-policy:
    "geosite:private,cn,apple":
      - "tcp://223.5.5.5:53#DIRECT"
      - "tcp://1.1.1.1:53#main-select"

# rules 是运行配置必填项，按顺序首条命中。DIRECT 与 REJECT 是内置动作，其他
# 动作必须精确使用实际节点名或代理组名。`PROXY` 没有特殊别名。rules 不能为空，
# 必须恰好以一个指向实际节点或代理组的 MATCH 结束；不存在隐式 MATCH 或 DIRECT
# 回退。选中组时使用当前成员，组本身不做 health check、测速或自动 failover。
rules:
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - DOMAIN-SUFFIX,anytls.example,anytls-edge
  - NETWORK,UDP,anytls-edge
  - MATCH,main-select

# measureDelay 使用独立的 node-only 配置：顶层只能包含 proxies，不能包含
# proxy-groups。节点字段和代理图校验与上文一致，但不能出现 port/socks-port/authentication、
# tun、sniffer、Controller、DNS、rules 或 GeoData；此接口的 dialer-proxy 只能引用具体
# 节点。VCore 从“未被任何 dialer-proxy 引用”的节点推导唯一链头，且该链必须覆盖
# 全部节点。测速不创建监听器、公共实例、TUN/protect 租约、DNS、规则引擎、代理组
# 或 GeoData 注册。
#
# 最小测速示例：
# proxies:
#   - name: exit
#     type: anytls
#     server: anytls.example.com
#     port: 443
#     password: secret
